name: CI
on:
  pull_request:
  push: { branches: [main] }

# a newer push to the same branch cancels the run that's still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · typecheck · unit tests · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: places, POSTGRES_PASSWORD: places, POSTGRES_DB: places }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U places" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      TZ: Africa/Cairo
      DATABASE_URL: postgresql://places:places@localhost:5432/places
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: Prisma schema + client
        run: pnpm --filter @places/db exec prisma validate && pnpm --filter @places/db exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Business rules (packages/domain)
        run: pnpm test
      - run: pnpm build

      # headless Chromium for the PDFs (ADR-0005), with the system libraries it needs
      - name: Chromium for PDFs
        run: cd apps/api && npx playwright-core install --with-deps --only-shell chromium

      # S3-compatible storage for the file tests. MinIO no longer publishes images, so versitygw (same S3 API)
      - name: File storage (S3)
        run: |
          pw=ci-$(openssl rand -hex 12)
          echo "S3_SECRET_KEY=$pw" >> "$GITHUB_ENV"
          docker run -d --name s3 -p 9000:9000 -e ROOT_ACCESS_KEY=places -e ROOT_SECRET_KEY=$pw \
            versity/versitygw:v1.9.0 --port :9000 --iam-dir /tmp/vgw posix /tmp/vgw
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:9000 && break; sleep 1; done

      # the same .env a developer has locally, with throwaway secrets made for this run only
      - name: Test environment
        run: |
          cat > .env <<ENV
          NODE_ENV=development
          TZ=Africa/Cairo
          DATABASE_URL=$DATABASE_URL
          REDIS_URL=redis://localhost:6379
          SESSION_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          WEB_ORIGIN=http://localhost:3000
          SEED_DEV_PASSWORD=Ci$(openssl rand -hex 8)7
          S3_ENDPOINT=http://localhost:9000
          S3_BUCKET=places
          S3_ACCESS_KEY=places
          S3_SECRET_KEY=$S3_SECRET_KEY
          ENV
      - name: Migrate + seed
        run: pnpm --filter @places/db migrate:deploy && pnpm db:seed
      - name: API end-to-end tests
        run: |
          (cd apps/api && node dist/main.js > ../../api.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:4000/api/v1/auth/me && break; sleep 1; done
          pnpm --filter @places/api test:e2e
      # 13.4 · the demo's quick tour in the real web app (same API, same Chromium)
      - name: Browser tour
        run: |
          (cd apps/web && npx next start -p 3000 > ../../web.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000/login && break; sleep 1; done
          pnpm --filter @places/web test:browser
      # boots next to the running API, registers every job in JOBS and is still alive a few seconds later
      - name: Worker starts and registers its jobs
        run: |
          (cd apps/worker && node src/main.ts > ../../worker.log 2>&1 &)
          for i in $(seq 1 30); do grep -q "worker: up" worker.log && break; sleep 1; done
          sleep 5
          cat worker.log
          n=$(sed -nE 's/.*worker: up · ([0-9]+) job.*/\1/p' worker.log)
          test -n "$n" && test "$n" -eq "$(grep -c 'worker: registered' worker.log)"
          test "$n" -eq "$(grep -cE '^\s*\{ name: "' apps/worker/src/main.ts)"
          pgrep -f "node src/main.ts" > /dev/null || { echo "worker crashed after boot"; exit 1; }
          pkill -TERM -f "node src/main.ts"
      - name: API log (on failure)
        if: failure()
        run: cat api.log web.log worker.log || true
