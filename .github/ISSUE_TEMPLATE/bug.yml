name: Bug
description: حاجة شغالة غلط
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes: { label: خطوات تكرار المشكلة, placeholder: "1. ادخل بحساب … 2. افتح … 3. دوس …" }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: المفروض يحصل إيه / اللي حصل }
    validations: { required: true }
  - type: input
    id: where
    attributes: { label: فين, placeholder: "local / staging · ديسكتوب / موبايل · الحساب" }
