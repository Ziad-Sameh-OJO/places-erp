# Local development services. `pnpm infra:up` then `pnpm dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: places, POSTGRES_PASSWORD: places, POSTGRES_DB: places, TZ: Africa/Cairo }
    ports: ["5432:5432"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U places"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mailpit: # catches every email the system sends; UI on http://localhost:8025
    image: axllent/mailpit:v1.21
    ports: ["1025:1025", "8025:8025"]

  s3: # S3-compatible file storage (versitygw: MinIO no longer publishes images)
    image: versity/versitygw:v1.9.0
    command: --port :9000 --iam-dir /data posix /data
    environment: { ROOT_ACCESS_KEY: places, ROOT_SECRET_KEY: places-secret }
    ports: ["9000:9000"]
    volumes: ["./data/s3:/data"]
